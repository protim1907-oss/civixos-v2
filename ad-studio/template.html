<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>__HEADLINE__ — Civix250 ad</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#334155; }
  /* Fixed export frame — build.mjs stamps the exact pixel size */
  .ad{
    position:relative; width:__W__px; height:__H__px; overflow:hidden;
    background:
      radial-gradient(1100px 520px at 82% -8%, rgba(185,28,28,.28), transparent 60%),
      linear-gradient(160deg,#0b1220 0%,#0f172a 46%,#111f3d 100%);
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:#fff; display:flex; flex-direction:column;
  }
  /* faint stars field, right side */
  .stars{ position:absolute; inset:0; opacity:.10;
    background-image:radial-gradient(#fff 1.6px, transparent 1.7px);
    background-size:34px 34px; background-position:60% 0;
    -webkit-mask-image:linear-gradient(90deg,transparent 46%,#000 100%);
            mask-image:linear-gradient(90deg,transparent 46%,#000 100%); }
  /* top brand band on white so the logo reads crisp */
  .top{ height:__TOPH__px; background:#fff; display:flex; align-items:center;
    justify-content:space-between; padding:0 __PADX__px; flex:0 0 auto; z-index:2; }
  .wordmark{ display:inline-flex; align-items:baseline; gap:1px; font-weight:900;
    font-size:__LOGOH__px; letter-spacing:-.02em; line-height:1; }
  .wordmark .b1{ color:#0f172a; }
  .wordmark .b2{ color:#b91c1c; }
  .wordmark .star{ color:#1d4ed8; font-size:.62em; margin-right:6px; }
  .top .url{ color:#0f172a; font-weight:700; font-size:__URLFS__px; letter-spacing:.2px; }
  /* body */
  .body{ position:relative; z-index:2; flex:1 1 auto; display:flex; flex-direction:column;
    justify-content:center; padding:__BODYPADY__px __PADX__px; gap:__GAP__px; }
  .eyebrow{ color:#f87171; font-weight:800; letter-spacing:.16em; font-size:__EYEFS__px;
    text-transform:uppercase; }
  h1{ font-size:__H1FS__px; line-height:1.02; font-weight:800; letter-spacing:-.015em;
    max-width:__TXTW__px; text-shadow:0 2px 18px rgba(0,0,0,.35); }
  .desc{ font-size:__DESCFS__px; line-height:1.34; color:#cbd5e1; font-weight:500;
    max-width:__TXTW__px; }
  .cta{ margin-top:__CTAMT__px; display:inline-flex; align-items:center; gap:12px;
    align-self:flex-start; background:#b91c1c; color:#fff; font-weight:800;
    font-size:__CTAFS__px; padding:__CTAPY__px __CTAPX__px; border-radius:999px;
    box-shadow:0 10px 26px rgba(185,28,28,.42); }
  .cta .arrow{ font-size:__CTAFS__px; line-height:1; }
  /* bottom accent stripe: red / white / blue */
  .stripe{ position:absolute; left:0; right:0; bottom:0; height:__STRIPEH__px; z-index:3;
    background:linear-gradient(90deg,#b91c1c 0 34%,#e2e8f0 34% 42%,#1d4ed8 42% 100%); }
</style>
</head>
<body>
  <div class="ad">
    <div class="stars"></div>
    <div class="top">
      <span class="wordmark"><span class="b1">Civix</span><span class="b2">250</span></span>
      <span class="url">__URL__</span>
    </div>
    <div class="body">
      <div class="eyebrow">__EYEBROW__</div>
      <h1>__HEADLINE__</h1>
      <p class="desc">__DESC__</p>
      <span class="cta">__CTA__ <span class="arrow">→</span></span>
    </div>
    <div class="stripe"></div>
  </div>
</body>
</html>
